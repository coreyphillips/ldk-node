[package]
name = "ldk-node-chicory-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
ldk-node = { path = "..", features = ["chicory"] }

[patch.crates-io]
lightning = { path = "../vendor/lightning" }
lightning-liquidity = { path = "../vendor/lightning-liquidity" }

[lib]
path = "wire_boundary.rs"

[[bin]]
name = "chicory_wire"
path = "fuzz_targets/chicory_wire.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
