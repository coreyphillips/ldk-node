# Generated by `spar init`. Each agent inherits a command template from a
# built in preset; anything set here overrides it.
#
# Commented lines are the other options, each with a working value.
# Uncomment one to change it.

[agents.claude]
preset = "claude"

# Model takes an alias or a full name like claude-opus-5-5. Check the
# current sets with: claude --help

# Omit model to use the CLI's own default. One of: opus | fable | sonnet.
model = "opus"

# Omit effort to use the CLI's own default. One of: high | low | medium |
# xhigh | max.
effort = "xhigh"

# Seconds one call may take before spar gives up. A timeout costs the whole
# call and is never retried, so err long.
# timeout = 3600

# A stand in for when this CLI refuses, stalls, or runs out of quota. It
# answers in place of this agent, never alongside it.
# [agents.claude.fallback]
# preset = "cursor"

# command, output, search_paths and the rest are in spar.example.toml, for
# pairing a CLI that has no preset.

[agents.codex]
preset = "codex"

# Codex lists neither set in its help. ~/.codex/models_cache.json is what
# your account is currently offered, and effort is passed through as -c
# model_reasoning_effort=...

# Omit model to use the CLI's own default. One of: gpt-6.1-sol | gpt-6-astra
# | gpt-6-sol | gpt-6-luna | gpt-5.6-sol | gpt-5.6-terra | gpt-5.6-luna |
# gpt-5.6-pro | gpt-5.5 | gpt-5.3-codex-spark.
model = "gpt-6.1-sol"

# Omit effort to use the CLI's own default. One of: high | ultra | max |
# xhigh | medium | low | minimal | none.
effort = "xhigh"

# Seconds one call may take before spar gives up. A timeout costs the whole
# call and is never retried, so err long.
# timeout = 3600

# A stand in for when this CLI refuses, stalls, or runs out of quota. It
# answers in place of this agent, never alongside it.
[agents.codex.fallback]
preset = "cursor"

# command, output, search_paths and the rest are in spar.example.toml, for
# pairing a CLI that has no preset.

[loop]
# In the custody loop, review rounds one invocation may spend asking for
# changes. A full-budget run may then use one extra closing pass. In `spar
# review`, this selects up to three phases: independent review,
# cross-adjudication, and rebuttal. Resuming a custody run grants a fresh
# budget, so this is not a lifetime cap.
max_rounds = 4

# Merge when no blocking findings remain. Off on purpose: two models
# agreeing is not the same as being right, and neither carries the
# consequences.
auto_merge = false

# Which agent takes the first pass. The other one reviews it.
first_implementor = "claude"

# Isolate each issue in its own git worktree. Set false to work in the main
# checkout.
worktrees = true

# Close an issue both reviewers declined, after posting the shared
# reasoning. A tracking issue is left open whatever this says.
close_skipped = true

# Where a follow-up goes. issues files them, local writes .spar/followups.md
# and leaves the tracker alone, none drops them. `spar followup` works that
# file.
followups = "local"

# File a non-blocking finding as a follow-up. Off, because not gating a
# merge is not the same as deserving somebody's triage queue.
# file_non_blocking = false

# Most follow-ups one run may record before it stops and says what it
# dropped. A backstop, not a target. `spar followup` is bounded by --limit
# instead.
# max_followups = 5

# Most parts `spar split` will make out of one issue or pull request. A
# backstop against a queue nobody asked for, not a target, and what it holds
# back is said out loud. A part is never itself split, so if one is still
# too big, `spar split <part>` is one command away.
# max_split_parts = 4

# A command spar runs in the worktree after an editing call committed and
# before the branch is pushed, as an argv list or a string split on
# whitespace. Unset runs nothing. "I ran the tests" is the one claim in a
# report that nothing else checks, and a broken push costs the reviewer's
# round on a tree that does not build. On failure the output goes back to
# the same agent once; a second failure ends the round with the worktree
# kept and nothing pushed.
# check = []

# Keep worktrees after a run, for inspection.
# keep_worktrees = false

# Ignore issues and pull requests numbered below this when spar picks for
# itself. 0 is no floor, and a number you name explicitly is always
# honoured.
# min_number = 0

# Ask both agents to triage at once. They only read during triage, so there
# is nothing to serialise.
# parallel_triage = true

# Waves of newly filed follow-ups to fold back into this run rather than
# leaving them for the next one. Multiplies what a run costs.
# absorb_new_issues = 0

# Turn the checklist in a tracking issue into issues, link each item to the
# one covering it, tick an item off when its issue closes, and work the
# children in this run. Only ever acts on markdown task list items, so it is
# opt in per issue as well. `spar triage` prints what it would do without
# writing any of it.
# decompose_trackers = false

# Most unchecked items from one tracker's checklist that one run will act
# on. A cap, not a target, and what it left is named out loud.
# max_tracker_children = 5

# File nits as follow-ups too. Off, because a filed nit is somebody else's
# notification.
# file_nits = false

# Only a fallback. Whatever origin/HEAD points at wins when it resolves.
# base_branch = "main"

# Namespace the branches spar creates, for example "spar/". Without it they
# are issue-N, pr-N, and split-N-I with a suffix on repeated split names.
# branch_prefix = ""

# Where resume state is kept. local uses .spar/state and keeps it off the
# pull request.
# state_store = "local"

# Whether a pull request starts as a draft. until_approved opens one and
# marks it ready when the review converges, which is what the draft was
# saying while two agents were still arguing about it. always opens one and
# leaves it, and cannot be combined with auto_merge.
# drafts = "never"

# Extra instructions handed to both agents with every request, for what this
# repository always wants that spar has no setting for. --instructions adds
# to this for one run.
# instructions = ""

# Most of one issue, its body and the comments on it, that reaches a prompt.
# Sized so nothing a person wrote is cut. Past it the oldest comments go
# first, and a cut is said out loud when it happens.
# max_issue_chars = 60000

# Most every issue together, bodies and comments, may add to one triage
# prompt, or every recorded follow-up in one screening prompt. Past it,
# whole items wait for the next run rather than all of them losing their
# tails.
# max_triage_chars = 200000

# Whose comments `spar checkin` will act on, and whose comments under an
# issue reach the prompts that implement, triage, and review it. write is
# anybody GitHub says can write to this repository, which is the default
# because acting on a comment means pushing a commit to somebody's branch.
# The person who filed an issue is always read under it. anyone answers
# everyone, and still only changes code when both agents agree.
# checkin_trust = "write"

# Mark a review thread resolved when spar made the change it asked for. A
# thread spar disagreed with is left open whatever this says.
# checkin_resolve = true

# Most unanswered comments spar will answer on one pull request in a run. A
# backstop against a long argument being read back to somebody, not a
# target.
# max_checkin_comments = 20

[loop.effort_schedule]
# One key per kind of call, so a value means what its name says. Values
# are whatever each agent's own CLI accepts, listed above, so these are
# examples rather than defaults. Left out, a call falls back to
# round_1 or rest, and then to the effort the agent's own block asked
# for. Where the two CLIs do not share a vocabulary, put the schedule
# under [agents.NAME.effort_schedule] instead, with the same keys.
# triage      = "low"    # both agents, over the whole queue, per wave
# implement   = "high"   # writing the first draft
# review_1    = "high"   # the deep first review
# review_rest = "low"    # later rounds, which see a small delta
# respond     = "high"   # the author answering a review
# close       = "low"    # the closing merge safety pass
# screen      = "low"    # the follow-up screen, one call for the queue
# checkin     = "high"   # judging comments other people left
# split       = "high"   # proposing and checking a split
# brainstorm  = "high"   # every brainstorm round
# recheck     = "low"    # a second look after commits or replies
# round_1     = "high"   # read by any call above with no key set
# rest        = "low"    # the same, for later rounds and the close

[style]
# Strip em-dashes and en-dashes from everything spar posts, then refuse to
# post text that still has one.
ban_em_dash = true

# Strip mentions of the tooling, and Co-Authored-By trailers, from
# everything spar posts.
ban_ai_attribution = true

# Hold model prose to a length budget. false removes the valves entirely.
terse = true

# How much of its own working spar narrates into a pull request thread.
# outcome is one comment at the end, rounds is an audit trail, none never
# comments at all.
# pr_comments = "outcome"

# A finding, issue, or pull request title. Never ellipsised: a title ending
# in three dots reads as broken.
# max_title_chars = 140

# A one line verdict, or a refutation's argument.
# max_summary_chars = 2000

# A blocking finding's explanation, as it appears in the pull request
# thread.
# max_detail_chars = 6000

# A pull request body.
# max_body_chars = 8000

# A filed issue's body. Far larger on purpose: an issue is picked up cold
# months later. Fenced code blocks are never truncated and never count
# against it.
# max_issue_body_chars = 20000

[listen]
# Seconds between polls of GitHub's notifications for this repository.
# GitHub says how often it will answer and the larger of the two is used. A
# poll that finds nothing costs nothing against the rate limit, and waiting
# never costs an agent call.
# interval = 60

# Seconds between sweeps of the open pull requests. A push raises no
# notification for a reviewer, so the sweep is what notices a reviewed pull
# request moving.
# sweep = 300

# Seconds an item has to stay quiet before spar acts on it, so a push and
# three replies in the same minute cost one recheck rather than four.
# settle = 120

# Most seconds an item may keep settling before it is acted on anyway.
# max_wait = 900

# Rechecks one pull request gets from `spar listen` before a person has to
# run `spar review` on it again. A cap against two bots arguing, not a
# target. 0 turns automatic rechecks off.
# max_rechecks = 5

# What a pull request somebody asked you to review gets: review or ignore.
# on_review_requested = "review"

# What a pull request assigned to you gets: review or ignore.
# on_assigned = "review"

# What activity on a pull request you authored gets, since the same account
# cannot approve it: checkin may push a change both agents agree on, reply
# answers in words only, ignore does nothing.
on_own_pr = "checkin"

# Whether a review `spar listen` starts submits a formal verdict, approve or
# request changes, rather than a comment. A recheck always does.
verdicts = true
